services:
  - type: web
    name: niratree-store
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_WHATSAPP_PHONE
        value: "2349134837317"
      - key: ADMIN_SECRET_PIN
        value: "2026"
      - key: DATABASE_FILE
        value: "./data/orders.db"
